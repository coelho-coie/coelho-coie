<svg xmlns="http://www.w3.org/2000/svg" width="800" height="330" viewBox="0 0 800 330" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="17" xml:space="preserve" style="white-space:pre">
